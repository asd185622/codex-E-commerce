spring.application.name=springboot-mall
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/mall?serverTimezone=Asia/Taipei&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SHIWU_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 商品圖片預設保存於執行目錄下，可在部署時改由持久磁碟掛載。
mall.product-image.storage-dir=${PRODUCT_IMAGE_STORAGE_DIR:uploads/products}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
